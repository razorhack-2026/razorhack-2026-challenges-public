name: "Swarm Key Shuffle"
author: "Lt. Niko Copernicus"
category: Reverse Engineering

description: |
    The drone cluster went quiet after we cracked that last key. When it came back, it stopped reusing anything. Every handshake hands out a fresh public key and an encrypted clearance token, and the relay drops you if you fumble the token. We're tapped into one of their relay nodes, but the trick you used last time doesn't work anymore. Get the token back before the swarm rotates.

    See `protocol.txt` for the key parameters.

type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - { type: static, content: "flag{shuffle_off_this_mortal_lattice}", data: case_insensitive }

files:
    - dist/protocol.txt

hints:
    - { content: "The key pattern is familiar, but the private exponent must be outside the bounds for Wiener's Attack since it doesn't work.", cost: 25 }
    - { content: "Boneh-Durfee covers d < N^0.292.", cost: 75 }

connection_info: "nc {host} {port}"

requirements:
    prerequisites:
        - "Droning On"
    anonymize: true

tags:
    - hard
    - rsa
    - lattice
    - boneh-durfee
    - live-service

topics:
    - "quest:Drone Blockade"
    - instance:swarm-key-shuffle

state: hidden

version: "0.1"
