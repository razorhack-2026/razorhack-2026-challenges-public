# challenge.yml — RazorHack 2026 metadata format (ctfcli-compatible)
# Spec reference: https://github.com/CTFd/ctfcli (ctfcli/spec/challenge-example.yml)
#
# Level 2 of 3 of the KALIUM mining series — DCU Dog-02 on THE-DRILL.
# THE-DRILL (the SSH server) and Dog-02's unit file live in ../Remote-Mining/.

# ── Required ─────────────────────────────────────────────────────────────
name: "High Value Deposit"
author: WALL-D
category: Cryptography
description: |
    (This is an automated message from RazorPower Co - Extraction Division) Thank you for your commitment to the company. It seems like you have gone above and beyond and have dedicated yourself to manually extracting a KALIUM deposit. Thank you! Due to your shown interest and demonstrated skill, we have decided to redirect you to a larger, more critical deposit. We hope you continue to take the time to help us out with this manual mining effort and we'll let your supervisors know the great work you're doing!

    We got our eyes on you, champ,
    RazorPower Co - Extraction Division

# ── Scoring — do not edit ────────────────────────────────────────────────
# Uniform dynamic scoring (GM meeting 2026-08-17): every challenge starts at
# 500 and decays as more teams solve it. No per-challenge point values.
# `decay` and `minimum` are set globally once registration numbers are known —
# leave the placeholders alone; they'll be filled in one pass before the event.
type: dynamic
extra:
    initial: 500
    decay: 100      # PLACEHOLDER — set globally before the event
    minimum: 100    # PLACEHOLDER — set globally before the event

# ── Flag ─────────────────────────────────────────────────────────────────
flags:
    - "flag{H!9h-V@1u3-Emp10y33!}"

# ── Files the competitor downloads ───────────────────────────────────────
# None: the unit is reached over SSH on THE-DRILL.
files: []

# ── Live service ─────────────────────────────────────────────────────────
connection_info: "ssh -p {port} 'TEAM#XX@{host}' (XX = your team number, password kalium), then select unit 2 (or run `dcu 2`)"
# Each team gets its own copy of THE-DRILL (instance:the-drill, shared by Remote Mining,
# High Value Deposit and Employee of the Year). Only that team can reach it, so every
# TEAM# account there has the one password above (TEAM_PASSWORD in the copy).

# ── Challenge chain ──────────────────────────────────────────────────────
requirements:
    prerequisites:
        - "Remote Mining"
    anonymize: true

# ── Tags (public) ────────────────────────────────────────────────────────
tags:
    - medium
    - sha256
    - crypto-mining

# ── Housekeeping — leave as-is ───────────────────────────────────────────
# Story board (Razorhack-CTFd story.py): admin-only, players never see topics.
topics:
    - "quest:Kalium Rush"
    - instance:the-drill

state: hidden
version: "0.1"
