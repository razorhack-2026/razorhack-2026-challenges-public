# Competitor-facing front for the Ignition gateway. Only what the read-only Perspective client
# needs is passed through; everything else (the gateway web UI and login at /web and /main, the
# REST API at /data/api, other projects, Designer/launcher endpoints, /system/*) gets a 404.
# Built from the URLs the HMI client actually requests; re-check them if the project changes.
# The gateway shares this container's network namespace (one Fargate task per team), so it is
# 127.0.0.1:8089, and this proxy has 8088, the port players are given.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8088;
    server_tokens off;

    location = /StatusPing { proxy_pass http://127.0.0.1:8089; }

    # The one project, its client page, and the session websocket.
    location ^~ /data/perspective/client/Containment { include /etc/nginx/proxy_common.conf; proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/project/Containment { include /etc/nginx/proxy_common.conf; proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/hello/Containment { include /etc/nginx/proxy_common.conf; proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/style-classes/Containment { include /etc/nginx/proxy_common.conf; proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/symbol-style-classes/Containment { include /etc/nginx/proxy_common.conf; proxy_pass http://127.0.0.1:8089; }
    location ^~ /system/pws/Containment/ { include /etc/nginx/proxy_common.conf; proxy_read_timeout 3600s; proxy_pass http://127.0.0.1:8089; }

    # Shared static assets.
    location ^~ /data/perspective/fonts/ { proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/themes/ { proxy_pass http://127.0.0.1:8089; }
    location = /data/perspective/translationSettings { proxy_pass http://127.0.0.1:8089; }
    location ^~ /data/perspective/translations/ { proxy_pass http://127.0.0.1:8089; }
    location ^~ /res/perspective/ { proxy_pass http://127.0.0.1:8089; }

    location / { return 404; }
  }
}
