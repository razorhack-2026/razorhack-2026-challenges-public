<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none" stroke="#1c2b3f" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <rect x="0" y="0" width="480" height="320" fill="#fbfaf6" stroke="none" />
  <g stroke="#d8d3c4" stroke-width="1">
    <line x1="0" y1="160" x2="480" y2="160" stroke-dasharray="2 6"/>
    <line x1="240" y1="0" x2="240" y2="320" stroke-dasharray="2 6"/>
  </g>

  <!-- hull -->
  <path d="M120 160 L170 108 L330 108 L392 160 L330 212 L170 212 Z" />
  <path d="M170 108 L170 212 M330 108 L330 212" />

  <!-- cockpit / sensor dome -->
  <circle cx="250" cy="160" r="26" />
  <circle cx="250" cy="160" r="10" fill="#a8420f" fill-opacity="0.12" />

  <!-- drill arm assembly (front, left) -->
  <path d="M120 160 L58 160" />
  <path d="M58 148 L58 172 L36 172 L36 148 Z" />
  <path d="M36 154 L18 154 M36 166 L18 166" />

  <!-- thruster pod (rear, right) -->
  <path d="M392 160 L430 160" />
  <path d="M430 138 L430 182" />
  <path d="M436 142 L436 178 M442 148 L442 172" stroke-opacity="0.6" />

  <!-- RTG power pod, underslung -->
  <rect x="215" y="212" width="70" height="24" rx="1" />
  <line x1="230" y1="212" x2="230" y2="236" />
  <line x1="250" y1="212" x2="250" y2="236" />
  <line x1="270" y1="212" x2="270" y2="236" />

  <!-- comm mast / antenna -->
  <path d="M250 108 L250 78" />
  <circle cx="250" cy="72" r="5" />

  <!-- upper strut / sensor arm -->
  <path d="M200 108 L188 74 M300 108 L312 74" />
  <circle cx="188" cy="70" r="3.5" />
  <circle cx="312" cy="70" r="3.5" />

  <!-- landing / grapple feet -->
  <path d="M180 212 L166 244 M320 212 L334 244" />
  <path d="M156 244 L176 244 M324 244 L344 244" />

  <!-- callout leader lines + labels -->
  <g stroke="#5c584c" stroke-width="0.8" font-family="Consolas, Courier New, monospace">
    <path d="M58 148 L58 56 L22 56" />
    <path d="M430 138 L430 56 L458 56" />
    <path d="M250 72 L250 22" />
  </g>
  <g fill="#5c584c" stroke="none" font-family="Consolas, Courier New, monospace" font-size="11" letter-spacing="0.5">
    <text x="22" y="70">DRILL ASSEMBLY</text>
    <text x="22" y="84">// FC16</text>
    <text x="250" y="16" text-anchor="middle">COMM MAST</text>
    <text x="458" y="70" text-anchor="end">THRUSTER POD</text>
    <text x="458" y="84" text-anchor="end">x2</text>
    <text x="250" y="300" text-anchor="middle" fill="#a8420f" fill-opacity="0.85">FIG. 2-1 &#183; DM-7 GENERAL ARRANGEMENT &#183; UNIT ID 0x0A</text>
  </g>
</svg>
