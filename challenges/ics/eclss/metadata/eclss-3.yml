# Source writeup: solution/STAFF_GUIDE.md (ECLSS) and solution/eclss/SOLUTIONS.md
# Author's weight: 125 of the part's 1000 points (not used: uniform dynamic scoring).
name: "ECLSS 3: Breathe easy"
author: "Definitely Not Dr. Rootkit"
category: ICS
description: |
    **ECLSS, part 3 of 7.** You are on the deck crew of the **ISV Ozark
    Horizon**. Mid-transit, the Environmental Control & Life Support System
    started fighting the crew: oxygen sagging, CO2 climbing, the cabin running
    hot. The watch officer swears nobody touched the setpoints. The ship's PLC
    answers Modbus/TCP on port 502 (unit id 1) and its Ignition HMI is on port
    8088. Registers are 16-bit signed; scaled values are stored x10 or x100.
    All 22 ICS challenges use your team's own copy of this rig: start it from
    any of them (it takes a few minutes to come up). Stop resets the ship and
    the Training Bay.

    Oxygen is below the 19.5% floor and the generator is not keeping up.
    Something keeps dragging the O2 setpoint down. Get cabin O2 back into the
    19.5-23.5% band and hold it there. The PLC will publish a flag once O2 is
    in range.

    *Hint: the HMI shows the O2 setpoint's current value - find the same
    number in the PLC's holding registers. As in the Training Bay, the
    registers you can write start at 1024. Once bit 0 of holding register 14
    sets, the flag text appears near the ECLSS 1 banner.*

    The PLC keeps a live objective bitfield at **holding register 14**
    (`FlagsEarned`): bit 0 O2 in range, bit 1 CO2 in range, bit 2 temperature in
    range, bit 3 maintenance sync disarmed, bit 4 full nominal hold.

# Uniform dynamic scoring (GM meeting 2026-08-17) - do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

# Flag: HR1144-1159 once FlagsEarned bit0 sets (persists until PLC restart).
# Default value shipped by the kit; if src/flags.json or
# src/training/training_flags.json change, rebuild and update this to match.
flags:
    - "flag{br34th3_34sy_cr3w}"

# Paths are relative to this metadata/ folder, so dist/ is ../dist/.
files:
    - ../dist/eclss/CHALLENGES.md
    - ../dist/MODBUS_PRIMER.md
    - ../dist/eclss/REGISTER_MAP_PLAYER.md

# Each team's own copy: one Fargate task (topic instance:eclss). CTFd fills in {host}.
connection_info: "{host}:502 (Modbus/TCP, unit id 1)"

tags:
    - medium
    - eclss
    - modbus

topics:
    - instance:eclss
    - "quest:Environmental Challenges"

# Locked until the part before is solved; shown as ??? until then.
requirements:
    prerequisites:
        - "ECLSS 2: The ghost deck"
    anonymize: true

state: hidden
version: "0.1"
