# Source writeup: solution/STAFF_GUIDE.md (ECLSS) and solution/eclss/SOLUTIONS.md
# Author's weight: 150 of the part's 1000 points (not used: uniform dynamic scoring).
name: "ECLSS 4: Scrub it out"
author: "Definitely Not Dr. Rootkit"
category: ICS
description: |
    **ECLSS, part 4 of 7.** You are on the deck crew of the **ISV Ozark
    Horizon**. Mid-transit, the Environmental Control & Life Support System
    started fighting the crew: oxygen sagging, CO2 climbing, the cabin running
    hot. The watch officer swears nobody touched the setpoints. The ship's PLC
    answers Modbus/TCP on port 502 (unit id 1) and its Ignition HMI is on port
    8088. Registers are 16-bit signed; scaled values are stored x10 or x100.
    All 22 ICS challenges use your team's own copy of this rig: start it from
    any of them (it takes a few minutes to come up). Stop resets the ship and
    the Training Bay.

    CO2 is climbing past the alarm ceiling (5000 ppm). The CO2 removal
    assembly (CDRA) has two adsorption beds that are supposed to swing back and
    forth so one regenerates while the other scrubs. Right now it is pinned to
    one bed. Restore the swing so CO2 comes back into range.

    One fix won't hold: the maintenance sync re-pins the scrubber every 20
    s, and CO2 falls far more slowly than that. Keep the swing restored for
    a few minutes, or stand the sync down first (ECLSS 6).

    *Hint: the HMI shows the scrubber's mode and how often the beds swap.
    The swap time is a plain number in the PLC's holding registers (as in
    the Training Bay, the ones you can write start at 1024), and the mode
    sits right next to it. The mode is a number from 0 to 3, and the HMI's
    scrubber label changes as soon as you write one, so you can tell when
    the swing is back. Once bit 1 of holding register 14 sets, the flag text
    appears near the ECLSS 1 banner.*

    The PLC keeps a live objective bitfield at **holding register 14**
    (`FlagsEarned`): bit 0 O2 in range, bit 1 CO2 in range, bit 2 temperature in
    range, bit 3 maintenance sync disarmed, bit 4 full nominal hold.

