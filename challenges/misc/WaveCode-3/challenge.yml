name: "WaveCode 3"
author: "Lt. Niko Copernicus"
category: Misc

description: |
    Okay, this is bad. The beacon led us to RPC WAYFARER and she's running on fumes — life support is on its last few hours and her main computer is toast. The reactor restart authorization was never on paper; RazerPowerCo grew it into a Certus Quartz crystal, and the energy acceptor that used to charge it got fried when the reactor scrammed. The hull-strain logger caught the crystal's last interrogation before everything went dark, so those recordings are all we've got. Thing is, a certus-quartz resonator doesn't ring forever, and nobody aboard knows how to read one. I've gotta go help hand-crank the O2 scrubbers — can you get the authorization out of the recordings before the batteries give out?

type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - { type: static, content: "flag{please_sine_here_to_keep_breathing}", data: case_insensitive }

files:
    - dist/0e4b0ee53f0640ce.wav
    - dist/10516b7a7ff9b204.wav
    - dist/d71b1d23309a0b2e.wav
    - dist/crystal-format.md
    - dist/encoding.md

hints:
    - { content: "A ringing mode fades. A measurement over the whole ring-down reports its average loudness, not the loudness at the strike.", cost: 50 }
    - { content: "The nine header symbols are always `WC2:0010:`. You know exactly what those nine notes should be.", cost: 75 }

requirements:
    prerequisites:
        - "WaveCode 2"
    anonymize: true

tags:
    - hard
    - fft
    - dsp
    - transient-analysis

# Story board (Razorhack-CTFd story.py): admin-only, players never see topics.
topics:
    - "quest:WaveCode"

state: hidden

version: "0.1"
