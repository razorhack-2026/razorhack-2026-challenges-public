# Adversarial Memory replay oracle. Start with deploy/run.sh (reads the flag from challenge.yml).
services:
  relay:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: am-relay:latest
    container_name: am-relay
    environment:
      FLAG: "${FLAG:?run deploy/run.sh -- it reads the flag from challenge.yml}"
    ports:
      - "${PORT:-9443}:9443"
    read_only: true
    tmpfs:
      - /tmp                                   # the relay writes its self-signed cert here
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
