    decay: 100      # PLACEHOLDER — set globally before the event
    minimum: 100    # PLACEHOLDER — set globally before the event

flags:
    - flag{gr0und_c0ntr0l_t0_m4j0r_1ntrus10n}

files:
    - dist/Security.evtx
    - dist/Microsoft-Windows-Sysmon-Operational.evtx
    - dist/Microsoft-Windows-PowerShell-Operational.evtx

topics:
    - "arc:1:The Prologue"

tags:
    - hard

state: hidden
version: "0.1"
