name: "Houston, We Have a Problem"
author: "Jebediah Kerman"
category: Forensics
description: |
    The ship's technology maintenance team has noticed some anomalies on the library's public
    research computers. We're having trouble pinpointing the cause of the issues and where they
    started.

    See if you can find anything in the event logs for these systems:

    - `Security.evtx`
    - `Microsoft-Windows-Sysmon-Operational.evtx`
    - `Microsoft-Windows-PowerShell-Operational.evtx`

type: dynamic
extra:
