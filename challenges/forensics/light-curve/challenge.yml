name: "Light Curve"
author: "Jebediah Kerman"
category: Forensics
description: |
    A photometry station on the *variable star* monitoring array logged an unusually long
    observing run before going quiet. Ops handed over the raw historian export — see if
    there's anything in it besides the star.

    `scaled_value` is exactly what it looks like. Registers carry more than one kind of
    information.

type: dynamic
