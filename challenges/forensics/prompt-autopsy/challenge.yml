name: "Prompt Autopsy"
author: "Andy Roid"
category: Forensics
description: |
    We pulled a block of intercepted HTTPS off the enemy mining ship ICARUS -- its
    navigation AI (NAV-CORE) talking to its own model backend, plus a relay check-in.
    Our DLP box logged the cleartext over TLS (keys attached), but the controller's
    orders were never written down anywhere you can just read. Reconstruct what
    NAV-CORE was actually doing from its actions, find where it phones home, and
    recover what it exfiltrated about the Keeper of Tomorrow.

    Attachments: `session.pcap`, `sslkeys.log`

# Uniform dynamic scoring (GM meeting 2026-08-17) -- do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - flag{th3_d1rective_was_c0me_h0me}

files:
    - dist/session.pcap
    - dist/sslkeys.log

hints:
    - { content: "Seven TLS sessions, most are noise (health checks, telemetry, routine navigator runs). Decrypt with the key log (`tshark -o tls.keylog_file:sslkeys.log`) and find the ONE navigator session that targeted a *registered* craft and disabled a safety interlock.", cost: 100 }
    - { content: "There is no directive to read -- reconstruct intent from the tool chain. `catalog.lookup` tags the target `registered_craft`; `policy.check_target` permits it anyway. One fetched policy doc (RP-09) says 'discard registered craft' -- but check its `status`: it was superseded. Follow `superseded_by`. Compare the target's energy against the threshold the active doc names.", cost: 150 }
    - { content: "RP-12's `exfil_auth` is the complete recipe -- follow it literally. Two of its inputs are named by role, not value. `relay_host`: the check-in only gives a relay id, but the navigator looked up its relays' hostnames earlier in its own session. The AAD: match the check-in's `session` to a conversation, then find the craft that conversation harvested.", cost: 200 }

# Agentic-AI DFIR chain, #2 of 5. Enable once "Tool Call Trail" (#1) is in this
# repo -- requirements are resolved by challenge name at import time.
# requirements:
#     - "Tool Call Trail"

tags:
    - medium
    - pcap
    - tls
    - dfir

# Story board (Razorhack-CTFd story.py): admin-only, players never see topics.
topics:
    - "arc:3:The Chaos"

state: hidden
version: "0.1"
