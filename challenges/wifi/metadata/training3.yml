name: "Yo, those are my packets, bro…"
author: "Lt. Rico Kopernicus"
category: Wi-Fi
description: |
    Finally, now that we have a Wi-Fi interface in monitor mode, we can start
    looking around and *capturing packets*. Another command in the Aircrack-ng
    suite can do this.

    How many wireless networks are there?

# Uniform dynamic scoring (GM meeting 2026-08-17) — do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - type: static
      content: "flag{8}"
      data: case_insensitive

# No handout files — competitor gets network/VM access, not a download.

hints:
    - content: "`airodump-ng wlan0mon`"
      cost: 10

requirements:
    prerequisites:
        - "Mailbox Shenanigans"
    anonymize: true

connection_info: "ssh -p {port} root@{host} (password: password)"

tags:
    - training

topics:
    - "arc:0:Training"
    - instance:wifi

state: hidden
version: "0.1"
