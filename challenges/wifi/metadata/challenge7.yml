# Source writeup: solution/challenge7.md
name: "Breaching the Core"
author: "Lt. Rico Kopernicus"
category: Pwn
description: |
    You've worked your way into the audit service account and read every file
    it can touch, but the logs only tell you so much about what happened
    here. The core still answers to its own console - find the door it left
    open to itself and to its mysterious hijacker.

# Uniform dynamic scoring (GM meeting 2026-08-17) — do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - type: static
      content: "flag{l00pb4ck_tru5t_t00k_th3_c0nn}"
      data: case_insensitive

hints:
    - key: "hint_1"
      content: "You have access to read files, that includes reading the database config. Check out its `pg_hba.conf` settings."
      cost: 25
    - key: "hint_2"
      content: "The database trusts any connection from the machine's loopback host as the master `postgres` user, so any localhost connection would give you total access. There might be some way to open a localhost connection through Postgres itself."
      cost: 25
      requirements:
            - hint_1
    - key: "hint_3"
      content: "Once you get `postgres` access, you can use `PROGRAM` to run commands through Postgres. If you did the Black Box challenge, you should remember seeing a `bridge_ctl` program sitting around."
      cost: 10
      requirements:
            - hint_2

# No handout files — competitor gets network/VM access, not a download.

requirements:
    prerequisites:
        - "The Heap Never Let Go"
    anonymize: true

connection_info: "ssh -p {port} root@{host} (password: password)"

tags:
    - hard

topics:
    - "arc:3:The Chaos"
    - instance:wifi

state: hidden
version: "0.1"
