interface=wlan8
bind-dynamic

# Tell dnsmasq to log transactions
log-queries
log-dhcp
log-facility=/var/log/dnsmasq.log

# Disable DNS, only do DHCP
port=0

dhcp-range=192.168.1.100,192.168.1.200,12h

# Static IPs for containers
# Format: dhcp-host=<MAC_ADDRESS>,<IP_ADDRESS>

dhcp-host=A8:69:8C:4F:1D:92,192.168.1.11
