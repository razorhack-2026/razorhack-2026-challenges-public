ctrl_interface=/var/run/hostapd
interface=wlan0
ssid=ODINS_EYES
macaddr_acl=0
ignore_broadcast_ssid=0
hw_mode=a
channel=36
country_code=US
ieee80211d=1
ieee80211w=2 # Encrypt management frames (prevents unauthenticated deauth attacks)
wpa=2
auth_algs=1
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=ferrumaurum

# Non-secret heartbeat vendor IE (EID 221/0xdd): same OUI as the override
# signal's trigger IE (52:5a:52). Payload is fixed flavor text: "HEARTBEAT-ALIVE",
# it only demonstrates the IE's shape to anyone sniffing beacons.
# Structure: dd (EID 221) + length (in bytes) + OUI + OUI-type (0x01) + Payload
vendor_elements=dd13525a52014845415254424541542d414c495645
