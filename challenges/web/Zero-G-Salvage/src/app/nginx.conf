# Single public entrypoint: serves the built frontend and forwards /api/* to
# the backend on 127.0.0.1:3001 (both containers share one network namespace,
# as in the Fargate task). The backend listens on loopback only, so this is
# the only way to reach it.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # Client-side routes (/listings, /commodity/STEEL, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
