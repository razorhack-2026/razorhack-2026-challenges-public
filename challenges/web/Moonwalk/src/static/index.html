<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonwalk</title>
<style>
  :root {
    --bg: #06070c; --panel: #0d1019; --line: #232838; --text: #d9dde8; --muted: #7b8297;
    --accent: #9fd3ff; --bad: #ff7a7a; --good: #8ff0b0; --warn: #ffd27a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    background: radial-gradient(ellipse at 50% 115%, #1b2131 0%, var(--bg) 62%);
    font: 15px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; padding: 22px 16px;
  }
  h1 { font-size: 26px; letter-spacing: .35em; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 16px; text-align: center; max-width: 480px; }
  .hud { display: flex; justify-content: space-between; width: 100%; max-width: 360px; color: var(--muted); margin-bottom: 8px; }
  .hud b { color: var(--text); font-weight: 600; }
  .stage { position: relative; width: 100%; max-width: 360px; }
  canvas { display: block; width: 100%; height: 520px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px 10px 0 0; }
  .banner {
    position: absolute; left: 0; right: 0; top: 22%; text-align: center; font-weight: 600; letter-spacing: .15em;
    color: var(--warn); opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .banner.show { opacity: 1; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 360px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; overflow: hidden; }
  .keys button {
    color: #eef0f4; border: 0; border-left: 1px solid #10131b; padding: 16px 0;
    font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    text-shadow: 0 1px 2px rgba(0,0,0,.8);
    background:
      radial-gradient(circle at 22% 30%, rgba(0,0,0,.35) 0 5px, transparent 6px),
      radial-gradient(circle at 78% 70%, rgba(0,0,0,.3) 0 7px, transparent 8px),
      radial-gradient(circle at 64% 22%, rgba(0,0,0,.25) 0 3px, transparent 4px),
      radial-gradient(ellipse at 35% 25%, #6d6660 0%, #4a4540 45%, #2c2926 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.08), inset 0 -3px 6px rgba(0,0,0,.45);
    transition: filter .06s;
  }
  .keys button:first-child { border-left: 0; }
  .keys button.hit { filter: brightness(1.6); }
  .keys button.moved { color: var(--warn); }
  .msg { min-height: 48px; margin-top: 14px; text-align: center; max-width: 480px; word-break: break-all; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
  .start {
    margin-top: 12px; background: var(--accent); color: #06111c; border: 0; border-radius: 8px; padding: 10px 28px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .start:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
  <h1>MOONWALK</h1>
  <p class="sub">Asteroids fall toward the line. Smash each one with the key shown under its lane before it passes the line, lowest asteroid first. Keys <b>1 2 3 4</b> or tap. Each round opens with a 5-second countdown. Watch the keys: moonquakes rewire them.</p>

  <div class="hud">
    <span>Round <b id="round">-</b>/<b id="total">-</b></span>
    <span><b id="tps">-</b> rocks/s</span>
    <span>Hits <b id="hits">0</b></span>
  </div>
  <div class="stage">
    <canvas id="cv" width="360" height="520"></canvas>
    <div class="banner" id="banner">KEYS REWIRED</div>
  </div>
  <div class="keys" id="keys">
    <button data-lane="0">1</button><button data-lane="1">2</button>
    <button data-lane="2">3</button><button data-lane="3">4</button>
  </div>
  <button class="start" id="start">Launch</button>
  <div class="msg" id="msg"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height, LANE = W / 4, HIT_Y = H - 70, TILE_H = 96;

  let round = null;        // current round from the server
  let tiles = [];          // {lane, key, hitAt, hit}
  let next = 0;            // index of the bottom-most unhit tile
  let pressed = [];
  let alive = false, busy = false, totalHits = 0, raf = 0;
  let countdownUntil = 0, countdownRound = 0, lastKeymap = "1,2,3,4", bannerTimer = 0;

  // High-DPI canvas
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  async function api(path, body) {
    const r = await fetch(path, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    return r.json();
  }

  // ---------------------------------------------------------------- visuals
  const ROCK_R = 36;
  const STARS = Array.from({ length: 80 }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .2, a: Math.random() * .6 + .2,
  }));

  function makeAsteroid() {
    const n = 11 + Math.floor(Math.random() * 4), pts = [];
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + (Math.random() - .5) * .35;
      pts.push([ang, ROCK_R * (.78 + Math.random() * .24)]);
    }
    const craters = Array.from({ length: 2 + Math.floor(Math.random() * 3) }, () => {
      const a = Math.random() * Math.PI * 2, d = Math.random() * ROCK_R * .5;
      return { x: Math.cos(a) * d, y: Math.sin(a) * d, r: 4 + Math.random() * 7 };
    });
    const tone = 70 + Math.floor(Math.random() * 30);
    return { pts, craters, tone, rot: Math.random() * Math.PI * 2, spin: (Math.random() - .5) * .002 };
  }

  function rockPath(rock) {
    ctx.beginPath();
    rock.pts.forEach(([a, r], i) => {
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
  }

  function drawAsteroid(t, cx, cy, now, isNext) {
    const rock = t.rock, c = rock.tone;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.save();
    ctx.rotate(rock.rot + now * rock.spin);
    if (isNext) { ctx.shadowColor = "rgba(159,211,255,.9)"; ctx.shadowBlur = 18; }
    rockPath(rock);
    const g = ctx.createRadialGradient(-ROCK_R * .35, -ROCK_R * .35, 4, 0, 0, ROCK_R * 1.1);
    g.addColorStop(0, `rgb(${c + 75},${c + 66},${c + 58})`);
    g.addColorStop(.55, `rgb(${c + 20},${c + 14},${c + 8})`);
    g.addColorStop(1, `rgb(${c - 35},${c - 38},${c - 40})`);
    ctx.fillStyle = g; ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = isNext ? 2 : 1.2;
    ctx.strokeStyle = isNext ? "rgba(159,211,255,.85)" : "rgba(20,18,16,.8)";
    ctx.stroke();
    ctx.save(); rockPath(rock); ctx.clip();
    for (const k of rock.craters) {
      ctx.beginPath(); ctx.arc(k.x, k.y, k.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fill();
      ctx.beginPath(); ctx.arc(k.x - k.r * .25, k.y - k.r * .25, k.r * .8, Math.PI * .9, Math.PI * 1.7);
      ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
    // key label stays upright and readable
    ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(6,8,13,.72)"; ctx.fill();
    ctx.fillStyle = isNext ? "#ffffff" : "#d9dde8";
    ctx.font = "700 16px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(t.key, 0, 1);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }

  function drawBurst(t, cx, cy, now) {
    const age = now - t.smashedAt, life = 320;
    if (age > life) return;
    const k = age / life;
    ctx.save(); ctx.translate(cx, cy);
    ctx.globalAlpha = 1 - k;
    ctx.beginPath(); ctx.arc(0, 0, ROCK_R * (.4 + k), 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(159,211,255,.8)"; ctx.lineWidth = 2; ctx.stroke();
    t.shards.forEach(sh => {
      const d = 8 + k * sh.v;
      ctx.save(); ctx.translate(Math.cos(sh.a) * d, Math.sin(sh.a) * d); ctx.rotate(sh.a + k * 3);
      ctx.fillStyle = `rgb(${t.rock.tone + 40},${t.rock.tone + 33},${t.rock.tone + 26})`;
      ctx.fillRect(-sh.s / 2, -sh.s / 2, sh.s, sh.s * .7);
      ctx.restore();
    });
    ctx.restore();
  }

  function drawStars(now) {
    for (const st of STARS) {
      const y = (st.y + now * .006 * st.r) % H;
      ctx.globalAlpha = st.a; ctx.fillStyle = "#cfd8ff";
      ctx.fillRect(st.x, y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  function msg(text, cls = "") { const m = $("msg"); m.textContent = text; m.className = "msg " + cls; }

  function setKeycaps(keymap) {
    document.querySelectorAll("#keys button").forEach((b, i) => {
      b.textContent = keymap[i];
      b.classList.toggle("moved", keymap[i] !== i + 1);
    });
  }

  function flash(lane) {
    const b = document.querySelector(`#keys [data-lane="${lane}"]`);
    b.classList.add("hit"); setTimeout(() => b.classList.remove("hit"), 80);
  }

  function draw() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);
    drawStars(now);
    // lanes
    ctx.strokeStyle = "#1c2232"; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(i * LANE, 0); ctx.lineTo(i * LANE, H); ctx.stroke(); }
    // hit line
    ctx.fillStyle = "rgba(159,211,255,.18)"; ctx.fillRect(0, HIT_Y, W, 3);

    if (alive && now < countdownUntil) {
      const secs = Math.ceil((countdownUntil - now) / 1000);
      ctx.textAlign = "center";
      ctx.fillStyle = "#7b8297"; ctx.font = "600 15px ui-monospace, monospace";
      ctx.fillText(`ROUND ${countdownRound} STARTS IN`, W / 2, H / 2 - 70);
      ctx.fillStyle = "#e8ecf6"; ctx.font = "600 88px ui-monospace, monospace";
      ctx.fillText(secs, W / 2, H / 2 + 20);
      ctx.fillStyle = "#7b8297"; ctx.font = "600 13px ui-monospace, monospace";
      ctx.fillText("check the keys below", W / 2, H / 2 + 60);
    }

    if (round) {
      const speed = TILE_H * round.tiles_per_second / 1000;   // px per ms; tiles touch end to end
      for (let i = tiles.length - 1; i >= 0; i--) {
        const t = tiles[i];
        const bottom = HIT_Y + (now - t.hitAt) * speed;          // bottom edge reaches the line at hitAt
        const top = bottom - TILE_H;
        if (bottom < -ROCK_R || top > H) continue;
        const cx = t.lane * LANE + LANE / 2, cy = bottom - TILE_H / 2;
        if (t.hit) drawBurst(t, cx, cy, now);
        else drawAsteroid(t, cx, cy, now, i === next);
      }
      // missed: the bottom tile has fully passed the line
      if (alive && !busy && next < tiles.length && now > tiles[next].hitAt + TILE_H / speed) {
        gameOver("An asteroid slipped past the line. Mission failed.");
      }
    }
    raf = requestAnimationFrame(draw);
  }

  function showKeymap(r) {
    $("round").textContent = r.round; $("total").textContent = r.total_rounds;
    $("tps").textContent = r.tiles_per_second;
    setKeycaps(r.keymap);
    if (r.keymap.join() !== lastKeymap) {
      lastKeymap = r.keymap.join();
      clearTimeout(bannerTimer);
      $("banner").classList.add("show");
      bannerTimer = setTimeout(() => $("banner").classList.remove("show"), 2500);
    }
  }

  async function loadRound() {
    const r = await api("/api/round");
    if (!r.ok) return gameOver(r.error);
    showKeymap(r);
    if (r.countdown) {
      // New round: the keys are known now, the tiles arrive when the countdown ends.
      round = null; tiles = [];
      countdownRound = r.round;
      countdownUntil = performance.now() + r.starts_in_ms;
      setTimeout(() => { if (alive) loadRound(); }, r.starts_in_ms);
      return;
    }
    countdownUntil = 0;
    round = r;
    const issuedAt = performance.now() - (r.window_ms - r.remaining_ms);
    const interval = 1000 / r.tiles_per_second;
    tiles = r.rows.map((row, i) => {
      const lane = row.indexOf("#");
      return { lane, key: r.keymap[lane], hitAt: issuedAt + r.lead_ms + i * interval, hit: false, rock: makeAsteroid() };
    });
    next = 0; pressed = [];
  }

  async function press(key) {
    if (!alive || !round || busy || next >= tiles.length) return;
    const lane = round.keymap.indexOf(key);
    if (lane >= 0) flash(lane);
    pressed.push(key);
    const t = tiles[next];
    if (key !== t.key) return finish();          // wrong key: let the server judge it
    t.hit = true; next++; totalHits++;
    t.smashedAt = performance.now();
    t.shards = Array.from({ length: 7 }, () => ({ a: Math.random() * Math.PI * 2, v: 30 + Math.random() * 40, s: 3 + Math.random() * 5 }));
    $("hits").textContent = totalHits;
    if (next === tiles.length) finish();
  }

  async function finish() {
    busy = true;
    const res = await api("/api/step", { nonce: round.nonce, keys: pressed.concat(
      Array(Math.max(0, tiles.length - pressed.length)).fill(0)) });
    busy = false;
    if (!res.ok) return gameOver(res.error);
    if (res.done) {
      alive = false; round = null; tiles = [];
      msg("Mission complete: " + res.flag, "good");
      $("start").disabled = false;
      return;
    }
    loadRound();
  }

  function gameOver(reason) {
    alive = false; countdownUntil = 0; msg(reason, "bad");
    $("start").disabled = false;
  }

  $("start").onclick = async () => {
    $("start").disabled = true; msg(""); totalHits = 0; $("hits").textContent = 0;
    round = null; tiles = []; lastKeymap = "1,2,3,4"; setKeycaps([1, 2, 3, 4]);
    const r = await api("/api/start");
    if (!r.ok) return gameOver(r.error);
    alive = true;
    await loadRound();
  };
  $("keys").addEventListener("pointerdown", e => {
    const b = e.target.closest("button");
    if (b) press(+b.textContent);
  });
  addEventListener("keydown", e => {
    if (!e.repeat && ["1", "2", "3", "4"].includes(e.key)) { e.preventDefault(); press(+e.key); }
  });
  cancelAnimationFrame(raf); draw();
})();
</script>
</body>
</html>
