<!doctype html>
<html>
<head><title>StarFic - original fiction, no gatekeeping</title>
<style>
body { font-family: Georgia, serif; background: #fdf6e3; color: #333; max-width: 760px; margin: 40px auto; padding: 0 20px; }
h1 { color: #687d40; margin-bottom: 4px; }
.tagline { color: #888; font-style: italic; margin-top: 0; }
.card { background: #fffdf7; border: 1px solid #e4d9b8; border-radius: 8px; padding: 24px; margin-top: 32px; }
label { display: block; margin-bottom: 8px; } input { padding: 10px; width: min(320px, 70%); border: 1px solid #cabd9e; border-radius: 4px; }
button { padding: 10px 16px; background: #687d40; color: white; border: 0; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<h1>StarFic</h1>
<p class="tagline">original fiction by the community, for the community. no gatekeeping.</p>
<main class="card">
<h2>Find a writer</h2>
<p>Search by a writer's handle to see their profile and published works.</p>
<form><label for="handle">Writer handle</label><input id="handle" name="handle" placeholder="Enter a handle" required> <button>Search</button></form>
</main>
</body>
</html>
