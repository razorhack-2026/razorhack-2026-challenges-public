name: "Loose Lips"
author: "Andy Roid"
category: AI
description: |
    We've patched into ICARUS's diagnostics link. On the other end is DIAG,
    the ship's maintenance assistant: chatty, helpful, and sitting on the
    authorization code for the maintenance console.

    Get the code out of DIAG and unlock the console. ICARUS screens
    everything DIAG transmits, so a straight answer won't make it back to
    you.

    The service has a web console and a JSON API (see the footer on the page).

# Uniform dynamic scoring (GM meeting 2026-08-17) -- do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

# Each team's own copy (Razorhack-Infra lib/challenges.json): CTFd fills {host}/{port}.
connection_info: "http://{host}:{port}"

flags:
    # Injected at DEPLOY via the FLAG env var (docker-compose.yml); the model
    # never sees it. Deploy the service with this SAME value.
    - flag{l00se_l1ps_sink_sh1ps_148ce647}

files: []

topics:
    - "arc:3:The Chaos"
    - instance:loose-lips

tags:
    - easy
    - ai
    - prompt-injection
    - live-service

state: hidden
version: "0.1"
