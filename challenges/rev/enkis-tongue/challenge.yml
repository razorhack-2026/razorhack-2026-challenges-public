name: "Enki's Tongue"
author: "Andy Roid"
category: Reverse Engineering
description: |
    Deeper in the dig sits a second, older artifact -- and it does not babble. It
    answers only to an utterance that is consistent across its whole length: change
    one syllable and the whole thing is wrong. Recovering the words is not the end
    -- the artifact then *speaks back* in a tongue keyed to what you said.

    You are given `enkivm` (the artifact's interpreter) and `enki.nam` (the sealed
    incantation). Feed your spoken words to it on stdin:

        ./enkivm enki.nam        # then type or pipe your incantation

    Wrong words are met with silence. Reverse the interpreter, read the
    incantation, and recover the one utterance that unbinds it. Speak it, and the
    artifact gives up what it holds.

# Uniform dynamic scoring (GM meeting 2026-08-17) -- do not edit.
# decay/minimum are placeholders, set globally before the event.
type: dynamic
extra:
    initial: 500
    decay: 100
    minimum: 100

flags:
    - flag{z3_unb1nds_the_true_t0ngue_0f_enki}

files:
    - dist/enkivm
    - dist/enki.nam
    - dist/SHA256SUMS

hints:
    - { content: "`enkivm` is a small virtual machine (the enki-VM family -- a harder cousin of the Glossolalia crackme) and `enki.nam` is its bytecode. Reverse the fetch/decode loop; it has one extra op beyond the usual set: a rotate (ROL). The program reads your whole input first, then checks it, then emits.", cost: 75 }
    - { content: "The check is NOT per-byte. Each constraint couples in[i] with a *scattered* other byte in[jtab[i]] -- jtab is a table in the data (an arithmetic-mod-n permutation), and jtab[i] can point at a byte you haven't fixed yet. There is no left-to-right inverse. Model the whole thing and solve it (Z3 is the easy button; the permutation also decomposes into cycles you can propagate).", cost: 150 }
    - { content: "Recovering the input is only half of it. The flag is a stream cipher, not stored: a key is folded from ALL your input bytes, then a small Speck-like ARX keystream (counter mode over the byte index) is XORed onto it. Re-derive the key from your recovered incantation and run the cipher -- or just feed the incantation back to enkivm and let it decrypt.", cost: 250 }

tags:
    - hard
    - vm
    - bytecode
    - constraint-solving
    - z3
    - cipher
    - offline

# Story board (Razorhack-CTFd story.py): admin-only, players never see topics.
topics:
    - "arc:3:The Chaos"

state: hidden
version: "0.1"
