name: 'Captain, we stopped'
author: Tyrian Sol
category: Reverse Engineering
description: >-
    It looks like one our thrusters went offline. The program required for the thruster system needs an authorization code, but IT went on lunch. You need to grab the code for us to get it back online.
type: dynamic
extra:
  initial: 500
  decay: 100
  minimum: 100
flags:
- flag{power_on_lets_go}
files:
- dist/thruster_ctl
topics:
    - "arc:2:Buildup"

tags:
- easy
- reversing
- binary
- xor
state: hidden
version: '0.1'
hints:
- content: The binary checks exactly 16 bytes against a transformed constant.
  cost: 15
- content: Each stored byte is the real character XOR 0x42. The same mask hides the
    flag.
  cost: 35
- content: Look at the comparison loop to determine which 16-byte input the controller
    accepts.
  cost: 50
